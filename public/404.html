<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seite nicht gefunden – MMS Umzug Bremen</title>
  <meta name="description" content="Die angeforderte Seite wurde nicht gefunden.">
  <link rel="icon" type="image/png" href="./favicon-32.png">
  <style>
    :root { --mms-green: #2e7d32; --navy: #1a237e; --bg: #f4f6f8; --text: #1f2937; }
    * { box-sizing: border-box; margin: 0; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 2rem; }
    h1 { font-size: 4rem; color: var(--navy); margin-bottom: .5rem; }
    p { margin-bottom: 1.5rem; color: #4b5563; }
    a { display: inline-block; background: var(--mms-green); color: #fff; padding: .75rem 1.5rem; border-radius: .5rem; text-decoration: none; font-weight: 600; }
    a:hover { opacity: .9; }
  </style>
</head>
<body>
  <h1>404</h1>
  <p>Die angeforderte Seite wurde nicht gefunden.</p>
  <a href="./">Zurück zur Startseite</a>
</body>
</html>
